name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Presets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install Renovate
        run: npm install --no-save renovate

      - name: Validate preset files
        shell: bash {0}
        run: |
          EXIT_CODE=0
          for f in *.json; do
            [ "$f" = "renovate.json" ] && continue
            echo "Validating ${f}..."
            OUTPUT=$(npx renovate-config-validator --strict --no-global "${f}" 2>&1)
            VALIDATOR_EXIT_CODE=$?
            printf '%s\n' "$OUTPUT" | grep -v "^npm warn" || true
            if [ "$VALIDATOR_EXIT_CODE" -ne 0 ]; then
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

      - name: Validate repo config
        shell: bash {0}
        run: |
          echo "Validating renovate.json..."
          OUTPUT=$(npx renovate-config-validator 2>&1)
          VALIDATOR_EXIT_CODE=$?
          printf '%s\n' "$OUTPUT" | grep -v "^npm warn" || true
          exit $VALIDATOR_EXIT_CODE
